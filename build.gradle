plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = mcversion + "-" + mod_version + "-" + tag_lanzador
group = mod_group_id

base {
    archivesName = mod_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    // Version de NeoForge a usar (antes iba como dependency "net.neoforged:neoforge:...").
    version = neoversion

    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id,
                                    '--all',
                                    '--output', file('src/generated/resources/').getAbsolutePath(),
                                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()

    maven {
        name = "Curse Maven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    maven {
        name = "latviandevReleases"
        url = uri("https://maven.latvian.dev/releases")
    }

    maven {
        url 'https://jitpack.io'
    }
}

dependencies {
    compileOnly("dev.latvian.mods:rhino:$rhino_version")
    implementation ("dev.latvian.mods:kubejs-neoforge:${kubejs_version}")

    implementation "curse.maven:mangos-multiblock-library-revived-1406189:${mangomultiblock_version_id}"

    implementation "curse.maven:jei-238222:8470023"
    implementation "curse.maven:athena-841890:8061947"
    implementation "curse.maven:jade-324717:7545219"
    implementation "curse.maven:pipez-443900:8351631"
    implementation "curse.maven:mekanism-268560:7904058"
    implementation "curse.maven:ctm-267602:5587515"
    implementation "curse.maven:immersive-engineering-231951:6733669"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version: mcversion,
        minecraft_version_range: minecraft_version_range,
        neo_version: neoversion,
        neo_version_range: neo_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_license: mod_license,
        mod_name: mod_name,
        mod_named: mod_named,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description,
        kubejs_version: kubejs_version,
        mangomultiblock_version_id: mangomultiblock_version_id,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            "Specification-Title"     : mod_name,
            "Specification-Vendor"    : mod_authors,
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.version,
            "Implementation-Vendor"   : mod_authors,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}